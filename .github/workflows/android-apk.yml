# Her "main" güncellemesinde (veya Actions sekmesinden elle) Android APK üretir
# ve indirilebilir bir GitHub Release olarak yayınlar. Bilgisayar gerekmez.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Veri seti ve testler
        run: |
          node --disable-warning=ExperimentalWarning scripts/validate-data.ts
          node --disable-warning=ExperimentalWarning --test "tests/**/*.test.ts"

  apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Paketleri kur (Expo SDK ile uyumlu sürümler)
        run: |
          npm install
          npx expo install react react-native react-native-safe-area-context react-native-svg expo-sqlite expo-clipboard expo-status-bar
      - name: Expo uyumluluk kontrolü (bilgi amaçlı)
        run: npx expo-doctor@latest || true
      - name: Android projesini oluştur
        run: npx expo prebuild --platform android --clean
      - name: APK derle
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk ../tencere-${{ github.run_number }}.apk
      - name: Release olarak yayınla (telefondan indirilebilir)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Tencere APK ${{ github.run_number }}
          body: |
            Telefona kurulabilir test sürümü. Aşağıdaki .apk dosyasına dokunup indirin ve kurun.
            Fiyatlar örnek veridir; gerçek Migros fiyatı değildir.
          files: tencere-${{ github.run_number }}.apk
