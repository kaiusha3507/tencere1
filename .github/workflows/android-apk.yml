# Her "main" güncellemesinde (veya Actions sekmesinden elle) Android APK üretir
# ve indirilebilir bir GitHub Release olarak yayınlar. Bilgisayar gerekmez.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Veri seti ve testler
        run: |
          node --disable-warning=ExperimentalWarning scripts/validate-data.ts
          node --disable-warning=ExperimentalWarning --test "tests/**/*.test.ts"

  apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Paketleri kur (Expo SDK ile uyumlu sürümler)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../ci-logs
          npm install 2>&1 | tee ../ci-logs/1-npm-install.log
          npx expo install react react-native react-native-safe-area-context react-native-svg expo-sqlite expo-clipboard expo-status-bar 2>&1 | tee ../ci-logs/2-expo-install.log
      - name: Expo uyumluluk kontrolü (bilgi amaçlı)
        run: npx expo-doctor@latest || true
      - name: Android projesini oluştur
        shell: bash
        run: |
          set -o pipefail
          npx expo prebuild --platform android --clean 2>&1 | tee ../ci-logs/3-prebuild.log
      - name: APK derle
        working-directory: mobile/android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../../ci-logs/4-gradle.log
      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk ../tencere-${{ github.run_number }}.apk
      - name: Release olarak yayınla (telefondan indirilebilir)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Tencere APK ${{ github.run_number }}
          body: |
            Telefona kurulabilir test sürümü. Aşağıdaki .apk dosyasına dokunup indirin ve kurun.
            Fiyatlar örnek veridir; gerçek Migros fiyatı değildir.
          files: tencere-${{ github.run_number }}.apk
      # Hata olursa günlüklerin sonunu GitHub "annotation" olarak yazar; böylece
      # derleme kayıtları API üzerinden okunabilir.
      - name: Hata özeti
        if: failure()
        shell: bash
        working-directory: .
        run: |
          for f in ci-logs/*.log; do
            [ -f "$f" ] || continue
            msg=$(grep -v '^\s*$' "$f" | tail -n 60 | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=$(basename "$f")::$msg"
          done
